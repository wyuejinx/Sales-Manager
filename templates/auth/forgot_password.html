<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sales Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<script>
    if (localStorage.getItem('salesManagerTheme') === 'dark') {
        document.body.classList.add('dark-theme');
    }
</script>

<div class="auth-container">
    <div class="auth-panel">

        <section class="auth-hero">
            <span class="auth-badge">Sales Manager</span>
            <h1>Password Recovery</h1>
            <p>Enter your registered Gmail address to receive a secure 6-digit verification code to reset your password.</p>
        </section>

        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your email address to continue.</p>

            {% if error %}
            <div style="padding: 12px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 16px; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--border); font-weight: 500;">
                <i class="bi bi-exclamation-triangle-fill" style="margin-right: 6px;"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <input id="email" type="email" name="email" placeholder="user@gmail.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">Send Reset Code</button>
            </form>

            <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--muted);">
                Remembered your password? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Back to Login</a>.
            </p>
        </div>

    </div>
</div>

</body>
</html>
